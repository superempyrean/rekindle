[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/sdk",
    "crates/test-client",
    "crates/plugin-host",
    "crates/cli",
    "crates/analysis",
    "crates/sigmatch",
    "crates/anchor",
    "crates/hook",
    "crates/wire",
    "crates/wire-inject",
    "crates/install",
    "crates/release",
    "crates/launcher",
    "plugins/rust/*",
    "crates/plugin-host/tests/fixtures/misbehave",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/superempyrean/rekindle"
rust-version = "1.97"

[workspace.dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.3"
gimli = { version = "0.33.0", default-features = false, features = ["read", "std"] }
iced-x86 = "1.21"
object = "0.40.0"
prost = "0.14"
regex = "1.11.3"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tiny_http = "0.12"
toml = "1.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.1.4"
url = "2.5.7"
wasm-encoder = "0.262.0"
wasmparser = "0.262.0"
wasmtime = "50.0.1"
wit-bindgen = "0.63.0"
wit-component = "0.262.0"
wit-parser = "0.262.0"
zstd = "0.13"

# The workspace's own crates.
rekindle-analysis = { path = "crates/analysis" }
rekindle-anchor = { path = "crates/anchor" }
rekindle-hook = { path = "crates/hook" }
rekindle-install = { path = "crates/install" }
rekindle-plugin-api = { path = "crates/plugin-api" }
rekindle-plugin-host = { path = "crates/plugin-host" }
rekindle-release = { path = "crates/release" }
rekindle-sigmatch = { path = "crates/sigmatch" }
rekindle-wire = { path = "crates/wire" }
rekindle-wire-inject = { path = "crates/wire-inject" }

# The lint policy. Every crate opts in with `[lints] workspace = true`, and CI
# denies warnings. A suppression is `#[expect(lint, reason = "...")]` on the
# narrowest item, so it fails once the code no longer needs it.
[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
# Pedantic lints left off. Binary formats and recovered layouts are read with
# integer casts whose ranges the format bounds, and addresses and byte
# patterns are written as a disassembler shows them.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unreadable_literal = "allow"
# Colour and geometry code uses the names of the maths (h, s, l, x, y).
many_single_char_names = "allow"
similar_names = "allow"
# Rustdoc sections on every fallible function and `#[must_use]` on every
# getter repeat what the signature says.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"

# Dependencies build without debug info, and tests without incremental
# caches. With them, every test binary carried a full PDB of wasmtime (about
# 650 MB each), and target/ reached 250 GB.
[profile.dev.package."*"]
debug = false

[profile.test]
incremental = false

# Compiling a plugin is Cranelift's job; unoptimized, it makes loading a large
# component (a JS plugin embeds an interpreter) take tens of seconds
# in debug builds and tests. Optimize just the compiler crates there.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

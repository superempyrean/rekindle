[package]
name = "rekindle-launcher"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "rekindle's one program for users: the installer the first time, then the repair tool. Installs per user, places rekindle beside the client, keeps versions and rolls back one that doesn't start, and updates rekindle's own files from the release channel."

[lib]
name = "rekindle_launcher"
path = "src/lib.rs"

[[bin]]
# Installed as `rekindle.exe`; the release step ships it as `rekindle-setup.exe`.
name = "rekindle-launcher"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
rekindle-release = { workspace = true }
rekindle-install = { workspace = true }

# The setup window. Windows only, like the launcher's installing.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[lints]
workspace = true

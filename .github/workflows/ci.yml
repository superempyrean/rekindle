# Tests and lints both workspaces. The root workspace runs on Linux on every
# push to main and every pull request; a Linux runner minute is cheaper and
# builds are faster. The Windows job builds and lints the client workspace
# and tests the launcher, the hook crate and phoenix-guest, the root
# workspace's Windows-only crates. A Windows minute counts double against the
# Actions quota of a private repository, so there that job runs on pull
# requests and on demand. While the repository is public, Actions minutes are
# free and it runs on every push too. The Windows job also builds and tests
# phoenix-view, the GPUI app that runs Phoenix's real guest; its APK-backed
# tests skip without a Discord build, which CI doesn't have. The client's
# live self-test runs against the mock client, which isn't in this repository.

name: CI

# Changes to Markdown alone don't run it. Code comments and rustdoc are in
# .rs files, so they still do.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root workspace
    runs-on: ubuntu-latest
    env:
      REKINDLE_REQUIRE_GUEST_TOOLCHAINS: "1"
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the compiler, its wasm target and clippy.
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - name: Install the TypeScript toolchain
        run: npm ci
        working-directory: plugins
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  client:
    name: Client workspace
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml in client/ pins the toolchain; rustup installs it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client
            . -> target
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # phoenix-view links GPUI and is the one crate here built and tested on
      # every run. Its tests skip the APK-backed ones unless a Discord build
      # is present, which it isn't in CI, so they check the rest.
      - name: Test phoenix-view
        run: cargo test -p phoenix-view --locked
      # A release build of phoenix-view, uploaded as a downloadable artifact:
      # just the exe. The Discord binary the user brings is never in the repo
      # or the build.
      - name: Build phoenix-view for release
        run: cargo build -p phoenix-view --release --locked
      - name: Bundle phoenix-view
        run: |
          New-Item -ItemType Directory -Force dist > $null
          Copy-Item target/release/phoenix-view.exe dist/
      - name: Upload phoenix-view
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-view-windows
          path: client/dist/*
          if-no-files-found: error
      # The launcher, the hook crate and phoenix-guest have Windows paths the
      # Linux root job doesn't compile.
      - name: Windows-only crates in the root workspace
        working-directory: .
        run: |
          cargo clippy -p rekindle-launcher -p rekindle-hook -p phoenix-guest --all-targets --locked -- -D warnings
          cargo test -p rekindle-launcher -p rekindle-hook -p phoenix-guest --locked

[package]
name = "channel-notes"
version = "0.1.0"
edition = "2024"
description = "Private notes-to-self per channel, shown when you open the channel. Stored only on this device."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.channel-notes"
name = "Channel Notes"
capabilities = ["read-client", "ui", "storage"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

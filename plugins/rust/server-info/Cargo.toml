[package]
name = "server-info"
version = "0.1.0"
edition = "2024"
description = "Server info from a guild's right-click menu: owner, age, members, channels, roles, boosts, your join date (state queries + host-formatted dates)."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.server-info"
name = "Server Info"
capabilities = ["read-client", "read-users", "ui"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

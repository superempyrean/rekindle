[package]
name = "notification-router"
version = "0.1.0"
edition = "2024"
description = "Silence or suppress the client's notifications by channel and keyword (notification filter in the render isolate)."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.notification-router"
name = "Notification Router"
capabilities = ["notifications"]

[[package.metadata.rekindle.settings]]
key = "quiet-channels"
type = "channels"
label = "Never notify from these channels"

[[package.metadata.rekindle.settings]]
key = "silent-words"
type = "string-list"
label = "Show without sound when the message contains"

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

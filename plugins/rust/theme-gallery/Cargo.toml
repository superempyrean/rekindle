[package]
name = "theme-gallery"
version = "0.1.0"
edition = "2024"
description = "Generates a full palette from one seed color using The Color API, and applies it."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.theme-gallery"
name = "Theme Gallery"
capabilities = ["network", "theming", "ui", "storage"]
network = ["www.thecolorapi.com"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package]
name = "message-link-embeds"
version = "0.1.0"
edition = "2024"
description = "Previews of the messages that message links point to, under the message (resolve-message-link + accessories)."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.message-link-embeds"
name = "Message Link Embeds"
capabilities = ["read-client", "read-messages", "ui"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

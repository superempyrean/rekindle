[package]
name = "focus-mode"
version = "0.1.0"
edition = "2024"
description = "Hides the member list and sets the user area apart, with a palette command to turn it off. Remembered across restarts."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.focus-mode"
name = "Focus Mode"
capabilities = ["ui", "storage", "theming"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

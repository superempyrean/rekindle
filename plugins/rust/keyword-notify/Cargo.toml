[package]
name = "keyword-notify"
version = "0.1.0"
edition = "2024"
description = "Toasts when a watched word appears in a message. Reads message content; stores only your keywords and match counts."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.keyword-notify"
name = "Keyword Notify"
capabilities = ["read-messages", "ui", "storage"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

[package]
name = "oneko"
version = "0.1.1"
edition = "2024"
description = "A little cat that chases your cursor across the client: a pointer + overlay demo."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.oneko"
name = "Cursor Cat"
capabilities = ["pointer", "overlay"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true

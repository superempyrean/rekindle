[package]
name = "bookmarks"
version = "0.1.0"
edition = "2024"
description = "Bookmark messages from their right-click menu; browse them from a chat-bar button. Stores message ids only."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.rekindle]
id = "dev.rekindle.bookmarks"
name = "Bookmarks"
capabilities = ["ui", "storage"]

[dependencies]
rekindle-sdk = { path = "../../../crates/sdk" }

[lints]
workspace = true
